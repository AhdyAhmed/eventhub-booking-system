services:
  postgres:
    image: postgres:16-alpine
    container_name: eventhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventhub_db
      POSTGRES_USER: eventhub_user
      POSTGRES_PASSWORD: eventhub_pass
    ports:
      # Host port 5433 -> container 5432.
      # Kept off the default 5432 on purpose so this doesn't clash with a
      # local Postgres instance already running on your machine.
      - "5433:5432"
    volumes:
      - eventhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub_user -d eventhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    restart: unless-stopped
    ports:
      # Host port 6380 -> container 6379, same reasoning as Postgres's 5433:
      # keeps this off the default port so it doesn't clash with a Redis
      # instance already running locally.
      - "6380:6379"
    volumes:
      - eventhub_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: eventhub-kafka
    restart: unless-stopped
    ports:
      # Host port 9094 -> container 9092, same "avoid clashing with a local
      # instance" reasoning as Postgres (5433) and Redis (6380). Unlike
      # those two, the port also has to be repeated below in
      # KAFKA_ADVERTISED_LISTENERS: Kafka's client protocol has the broker
      # tell connecting clients which address to actually send requests to,
      # and that has to be the host-reachable 9094, not the container-internal
      # 9092, or a client outside the container gets an address it can't reach.
      - "9094:9092"
    environment:
      # KRaft mode: Kafka runs its own metadata quorum instead of depending
      # on a separate ZooKeeper ensemble - one container, one thing to run,
      # instead of two. This is the officially supported mode as of Kafka
      # 3.7+ and the direction the project itself is moving, not a
      # workaround.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@eventhub-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Replication factor 1 because there's exactly one broker in this
      # local stack - a real cluster would use 3 for durability. Called out
      # explicitly rather than left to look like an oversight; see Design
      # decisions.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "eventhub-kraft-cluster-1"
    volumes:
      - eventhub_kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  eventhub_pgdata:
  eventhub_redisdata:
  eventhub_kafkadata:
