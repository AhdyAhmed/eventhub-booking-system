spring:
  application:
    name: eventhub-booking-system

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:eventhub_db}
    username: ${DB_USER:eventhub_user}
    password: ${DB_PASSWORD:eventhub_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate auto-ddl.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  cache:
    type: redis
    redis:
      # Fallback only - every cache actually in use (events, event-search,
      # seat-availability) has its own TTL set explicitly in CacheConfig,
      # tuned per-cache as of Day 9. This value only applies if a cache name
      # is ever added without a corresponding entry there.
      time-to-live: 2m
      cache-null-values: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.ahdyahmed.eventhub: DEBUG
